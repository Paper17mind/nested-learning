[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-learning-lite"
version = "0.1.0"
description = "A lightweight, zero-dependency NumPy implementation of Google's Nested Learning paradigm and HOPE architecture."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nested_learning*"]
